manifestVersion: 1
id: dwarner-verus-electrum
storage:
  dataRoot: data
category: crypto
name: Verus Electrum Server
version: "1.8.6"
tagline: Your own Electrum server for Verus
description: >-
  Run your personal Electrum server for Verus (VRSC) and connect lite wallets that support custom Electrum servers to it instead of using a public one.
  Your addresses and balances are then only looked up on your own Verus node.


  The app indexes the blockchain from your Verus Node app, shows the indexing progress, and gives you the server address to enter in your wallet.


  The first index takes several hours and needs several gigabytes of extra storage. Wallets can connect once it has caught up with your node.
  Verus Node must be fully synced first.


  The server uses plain TCP on port 17485 on your local network. It is not encrypted, so do not forward this port on your router.


  Powered by ElectrumX with Verus support from the Verus developers. This is a community package and is not maintained by the Verus Coin Foundation.
releaseNotes: ""
developer: Verus Coin Foundation
website: https://verus.io
dependencies:
  - dwarner-verus
repo: https://github.com/dwarner5522/umbrel-verus-electrum
support: https://github.com/dwarner5522/umbrel-verus-electrum/issues
port: 2114
gallery: []
path: ""
icon: https://raw.githubusercontent.com/dwarner5522/umbrel-verus-electrum/HEAD/icon.svg
defaultUsername: ""
defaultPassword: ""
widgets:
  - id: "sync"
    type: "text-with-progress"
    refresh: "5s"
    endpoint: "app:3000/api/widget/sync"
    link: ""
    example:
      type: "text-with-progress"
      link: ""
      title: "Electrum server"
      text: "83%"
      progressLabel: "Indexing"
      progress: 0.83
backupIgnore:
  - data/electrumx/db
submitter: dwarner5522
submission: https://github.com/dwarner5522/umbrel-verus-app-store
